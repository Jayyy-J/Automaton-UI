
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AUTOMATON — admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0d0f;
    --line: #1d2528;
    --alive: #49f6c3;
    --alive-dim: #49f6c333;
    --danger: #ff5d5d;
    --text: #e7ecee;
    --text-dim: #7c8a90;
    --amber: #f5b04d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, #0f2b24 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #1a1010 0%, transparent 40%);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    padding: 32px 20px 80px;
  }
  .wrap{ max-width: 860px; margin: 0 auto; }

  header{
    display:flex; justify-content:space-between; align-items:flex-start;
    flex-wrap: wrap; gap: 16px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 20px; margin-bottom: 28px;
  }
  .brand{ display:flex; align-items:center; gap: 12px; }
  .dot{
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--alive);
    box-shadow: 0 0 0 0 var(--alive-dim);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 var(--alive-dim); }
    70%{ box-shadow: 0 0 0 10px transparent; }
    100%{ box-shadow: 0 0 0 0 transparent; }
  }
  h1{ font-size: 20px; font-weight: 700; letter-spacing: 0.14em; }
  .status-line{ font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); margin-top: 2px;}
  .headerRight{ display:flex; align-items:center; gap: 12px; }
  #logoutBtn{
    font-family:'IBM Plex Mono', monospace; font-size: 12px;
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--line); padding: 8px 14px; border-radius: 4px;
    cursor: pointer; transition: color 0.2s, border-color 0.2s;
  }
  #logoutBtn:hover{ color: var(--text); border-color: var(--text-dim); }

  h2{ font-size: 13px; letter-spacing: 0.12em; color: var(--text-dim); font-weight: 600; margin-bottom: 10px;}

  .card{
    border: 1px solid var(--line);
    background: #0d1213;
    padding: 18px;
    margin-bottom: 28px;
  }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom: 14px; }
  .field label{
    font-family:'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--text-dim); letter-spacing: 0.06em;
  }
  .field input{
    font-family:'IBM Plex Mono', monospace; font-size: 14px;
    background: #070a0b; border: 1px solid var(--line); color: var(--text);
    padding: 10px 12px; border-radius: 4px; outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus{ border-color: var(--alive); }
  .row-inputs{
    display:flex; align-items:flex-end; gap: 12px; flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .row-inputs .field{ flex: 1 1 200px; margin-bottom: 0; }
  #createBtn{
    font-family:'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px;
    background: var(--alive); color: #06110d; border: none;
    padding: 11px 22px; border-radius: 4px; cursor: pointer;
    white-space: nowrap; transition: opacity 0.2s, transform 0.1s;
  }
  #createBtn:hover{ opacity: 0.88; }
  #createBtn:active{ transform: scale(0.98); }
  #createBtn:disabled{ opacity: 0.5; cursor: not-allowed; }
  .formMsg{
    font-family:'IBM Plex Mono', monospace; font-size: 12px;
    margin-top: 10px; min-height: 16px;
  }
  .formMsg.err{ color: var(--danger); }
  .formMsg.ok{ color: var(--alive); }

  .feed{ border: 1px solid var(--line); }
  .u-row{
    display:grid; grid-template-columns: 1fr 90px 110px 90px auto;
    gap: 14px; align-items:center;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    font-family: 'IBM Plex Mono', monospace; font-size: 13px;
  }
  .u-row:last-child{ border-bottom:none; }
  .u-row.head{
    color: var(--text-dim); font-size: 11px; letter-spacing: 0.06em;
  }
  .u-row .email{ color: var(--text); overflow-wrap: anywhere; }
  .u-role{
    font-size: 11px; padding: 3px 8px; border-radius: 20px;
    text-align:center; letter-spacing: 0.04em;
    border: 1px solid var(--line);
  }
  .u-role.admin{ color: var(--amber); border-color: #f5b04d55; background:#f5b04d11; }
  .u-role.user{ color: var(--alive); border-color: #49f6c355; background:#49f6c311; }
  .u-row .bal{ text-align:right; }
  .u-row .bots{ text-align:right; color: var(--text-dim); }
  .u-row .t{ color: var(--text-dim); font-size: 11px; text-align:right; }
  .empty{
    padding: 16px; text-align:center;
    font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">
        <div class="dot"></div>
        <h1>AUTOMATON — ADMIN</h1>
      </div>
      <div class="status-line" id="statusLine">panel de administración</div>
    </div>
    <div class="headerRight">
      <button id="logoutBtn">Cerrar sesión</button>
    </div>
  </header>

  <h2>CREAR CUENTA NUEVA</h2>
  <div class="card">
    <form id="createForm">
      <div class="row-inputs">
        <div class="field">
          <label for="newEmail">Email</label>
          <input id="newEmail" type="email" autocomplete="off" required />
        </div>
        <div class="field">
          <label for="newPassword">Contraseña (mín. 8 caracteres)</label>
          <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <button id="createBtn" type="submit">Crear cuenta</button>
      </div>
      <div class="formMsg" id="formMsg"></div>
    </form>
  </div>

  <h2>CUENTAS</h2>
  <div class="feed" id="usersFeed">
    <div class="empty">Cargando…</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => n === null || n === undefined ? '—' : ((n < 0 ? "-$" : "$") + Math.abs(n).toFixed(2));
const fmtDate = (iso) => new Date(iso).toLocaleString('es-CO');

async function loadUsers(){
  const feed = $('usersFeed');
  try{
    const res = await fetch('/api/admin/users');
    if(res.status === 401){ window.location.href = '/login'; return; }
    if(res.status === 403){ window.location.href = '/'; return; }
    const users = await res.json();

    feed.innerHTML = '';
    const head = document.createElement('div');
    head.className = 'u-row head';
    head.innerHTML = `<div>EMAIL</div><div>ROL</div><div style="text-align:right">SALDO</div><div style="text-align:right">BOTS</div><div style="text-align:right">CREADA</div>`;
    feed.appendChild(head);

    if(users.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No hay cuentas todavía.';
      feed.appendChild(empty);
      return;
    }

    users.forEach(u => {
      const row = document.createElement('div');
      row.className = 'u-row';
      row.innerHTML = `
        <div class="email">${u.email}</div>
        <div><span class="u-role ${u.role}">${u.role === 'admin' ? 'ADMIN' : 'USER'}</span></div>
        <div class="bal">${u.role === 'user' ? fmt(u.balance) : '—'}</div>
        <div class="bots">${u.role === 'user' && u.bot_count !== null ? u.bot_count : '—'}</div>
        <div class="t">${fmtDate(u.created_at)}</div>
      `;
      feed.appendChild(row);
    });
  }catch(e){
    feed.innerHTML = '<div class="empty">Error cargando cuentas.</div>';
  }
}

$('createForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('createBtn');
  const msg = $('formMsg');
  msg.textContent = '';
  msg.className = 'formMsg';
  btn.disabled = true;

  try{
    const res = await fetch('/api/admin/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: $('newEmail').value.trim(),
        password: $('newPassword').value,
      }),
    });
    const data = await res.json();
    if(!res.ok){
      msg.textContent = data.error || 'No se pudo crear la cuenta.';
      msg.classList.add('err');
    } else {
      msg.textContent = `Cuenta creada: ${data.email}`;
      msg.classList.add('ok');
      $('newEmail').value = '';
      $('newPassword').value = '';
      await loadUsers();
    }
  }catch(err){
    msg.textContent = 'Error de conexión. Intenta de nuevo.';
    msg.classList.add('err');
  }finally{
    btn.disabled = false;
  }
});

$('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login';
});

loadUsers();
</script>
</body>
</html>
