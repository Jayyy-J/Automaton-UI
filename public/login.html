
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AUTOMATON — acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0d0f;
    --line: #1d2528;
    --alive: #49f6c3;
    --alive-dim: #49f6c333;
    --danger: #ff5d5d;
    --text: #e7ecee;
    --text-dim: #7c8a90;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{ height:100%; }
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, #0f2b24 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #1a1010 0%, transparent 40%);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 20px;
  }
  .card{
    width: 100%; max-width: 380px;
    border: 1px solid var(--line);
    background: #0d1213cc;
    padding: 32px 28px;
    border-radius: 6px;
  }
  .brand{ display:flex; align-items:center; gap: 12px; margin-bottom: 6px; }
  .dot{
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--alive);
    box-shadow: 0 0 0 0 var(--alive-dim);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 var(--alive-dim); }
    70%{ box-shadow: 0 0 0 10px transparent; }
    100%{ box-shadow: 0 0 0 0 transparent; }
  }
  h1{ font-size: 20px; font-weight: 700; letter-spacing: 0.14em; }
  .sub{
    font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim);
    margin-bottom: 26px;
  }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom: 16px; }
  .field label{
    font-family:'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--text-dim); letter-spacing: 0.06em;
  }
  .field input{
    font-family:'IBM Plex Mono', monospace; font-size: 14px;
    background: #070a0b; border: 1px solid var(--line); color: var(--text);
    padding: 11px 12px; border-radius: 4px; outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus{ border-color: var(--alive); }
  button{
    width: 100%;
    font-family:'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px;
    background: var(--alive); color: #06110d; border: none;
    padding: 12px 22px; border-radius: 4px; cursor: pointer;
    margin-top: 6px;
    transition: opacity 0.2s, transform 0.1s;
  }
  button:hover{ opacity: 0.88; }
  button:active{ transform: scale(0.98); }
  button:disabled{ opacity: 0.5; cursor: not-allowed; }
  .msg{
    font-family:'IBM Plex Mono', monospace; font-size: 12px;
    margin-top: 14px; min-height: 16px; text-align:center;
  }
  .msg.err{ color: var(--danger); }
  .badge{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px; color: var(--text-dim);
    margin-top: 20px; text-align:center; letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="dot"></div>
      <h1>AUTOMATON</h1>
    </div>
    <div class="sub">iniciar sesión para continuar</div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required />
      </div>
      <button id="submitBtn" type="submit">Entrar</button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="badge">acceso restringido · sin registro público</div>
  </div>

<script>
const $ = (id) => document.getElementById(id);

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('submitBtn');
  const msg = $('msg');
  msg.textContent = '';
  msg.className = 'msg';
  btn.disabled = true;

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: $('email').value.trim(),
        password: $('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      msg.textContent = data.error || 'No se pudo iniciar sesión.';
      msg.classList.add('err');
      btn.disabled = false;
      return;
    }
    window.location.href = data.redirect || '/';
  } catch (err) {
    msg.textContent = 'Error de conexión. Intenta de nuevo.';
    msg.classList.add('err');
    btn.disabled = false;
  }
});
</script>
</body>
</html>
